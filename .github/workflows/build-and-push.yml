name: build-and-push

# Construye las imágenes de TLB (backend + frontend) EN GitHub → GHCR; luego
# despliega por SSH al VPS (pull + up). Sin builds en el VPS.
on:
  push:
    branches: [main]
    paths-ignore:          # cambios solo de docs/markdown NO disparan build+deploy
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/spc74-hub/tlb-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: VITE_API_URL=https://tlb.spcapps.com/api/v1
          tags: ghcr.io/spc74-hub/tlb-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on VPS (webhook → pull + up)
        run: |
          curl -fsS -X POST https://webhook.spcapps.com/ci-deploy \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"app":"tlb"}'
